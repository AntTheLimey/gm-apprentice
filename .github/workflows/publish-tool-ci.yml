name: Publish Tool CI

on:
  push:
    branches: [main]
    paths:
      - 'tools/publish/**'
      - 'scripts/temp_guard.py'
      - 'tests/shared-cases/**'
      - 'tests/benchmark-campaign/**'
      - 'scripts/build-theme-showcase.mjs'
      - 'skills/shared/scripts/gurps_calc.py'
      - '.github/workflows/publish-tool-ci.yml'
  pull_request:
    paths:
      - 'tools/publish/**'
      - 'scripts/temp_guard.py'
      - 'tests/shared-cases/**'
      - 'tests/benchmark-campaign/**'
      - 'scripts/build-theme-showcase.mjs'
      - 'skills/shared/scripts/gurps_calc.py'
      - '.github/workflows/publish-tool-ci.yml'

jobs:
  test:
    strategy:
      # Each OS reports on its own: one failing must not cancel the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tools/publish/package-lock.json

      - name: Install dependencies
        working-directory: tools/publish
        run: npm ci

      # The tests remove the temp folders they make (#565); the guard fails the
      # job, naming them, if anything is left behind in the temp folder, on a
      # red test run too.
      - name: Note what the temp folder holds
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/temp_guard.py snapshot "$RUNNER_TEMP/temp-before.txt"

      - name: Run tests
        working-directory: tools/publish
        run: npm test

      - name: The tests left nothing in the temp folder
        if: success() || failure()
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/temp_guard.py check "$RUNNER_TEMP/temp-before.txt"
