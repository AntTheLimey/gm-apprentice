name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from plugin.json
        id: version
        run: |
          VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          if [[ "$VERSION" == "null" || -z "$VERSION" ]]; then
            echo "::error::No version field in plugin.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build skill zips
        if: steps.check_tag.outputs.exists == 'false'
        run: ./scripts/build-skill-zips.sh

      - name: Check the zips ship every system notice
        if: steps.check_tag.outputs.exists == 'false'
        run: python3 scripts/attribution_check.py --zips dist

      # Generated notes start from the previous plugin release (v*), never from a
      # publish-v* tag the publish tool's own workflow created in between.
      - name: Find the previous plugin release
        if: steps.check_tag.outputs.exists == 'false'
        id: prev
        run: |
          PREV=$(git ls-remote --tags --refs origin 'refs/tags/v*' \
            | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1 || true)
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"
          echo "previous plugin release: ${PREV:-none}"

      - name: Create release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ steps.prev.outputs.tag }}
        run: |
          START=()
          if [[ -n "$PREV" ]]; then START=(--notes-start-tag "$PREV"); fi
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/*.zip \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes "${START[@]}"
