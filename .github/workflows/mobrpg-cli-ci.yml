name: mobRPG CLI CI

on:
  push:
    branches: [main]
    paths:
      - 'tools/mobrpg/**'
      - '.github/workflows/mobrpg-cli-ci.yml'
  pull_request:
    paths:
      - 'tools/mobrpg/**'
      - '.github/workflows/mobrpg-cli-ci.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here runs an authenticated git operation, so don't leave the
          # job token in the checkout for the test steps to reach.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        working-directory: tools/mobrpg
        run: pip install -e ".[test]"

      - name: Run tests
        working-directory: tools/mobrpg
        run: python -m pytest -q
