[mypy]
python_version = 3.10
files = skills/shared/scripts
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
ignore_missing_imports = True

# vaultlib is the module every other script imports, so it carries the
# strict settings. `strict = True` is deliberately NOT used here: mypy
# treats `strict` as a global flag even inside a per-module section, so
# writing it here silently turned full-annotation strictness on for every
# script in the directory (146 errors instead of 9). The individual flags
# `strict` implies are genuinely per-module, so they are spelled out.
[mypy-vaultlib]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_subclassing_any = True
disallow_any_generics = True
disallow_any_unimported = True
no_implicit_reexport = True
warn_return_any = True
strict_equality = True
extra_checks = True
