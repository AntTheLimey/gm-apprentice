<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #02050a;
  --ink: #d4ecff;
  --dim: #7593ae;
  --faint: #3b5064;
  --accent: #5ff0ff;
  --gold: #ffd27a;
  --keeper: #c98bff;
  --danger: #ff5a6a;
  --panel: rgba(5, 13, 22, 0.86);
  --line: rgba(95, 240, 255, 0.22);
  --head: "Chakra Petch", "Rajdhani", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 13px/1.5 var(--mono); }
#app, #labels { position: fixed; inset: 0; }
#labels { pointer-events: none; }
button, select, input { font: inherit; color: inherit; }
a { color: var(--accent); }

header { position: fixed; top: 14px; left: 16px; pointer-events: none; z-index: 5; }
header h1 { margin: 0; font: 600 18px/1.1 var(--head); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); text-shadow: 0 0 12px rgba(95,240,255,.5); }
#crumbs { margin-top: 6px; pointer-events: auto; font-size: 12px; color: var(--dim); }
#crumbs button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; }
#crumbs button:hover { text-decoration: underline; }

.label { font: 500 11px/1.2 var(--mono); color: var(--ink); white-space: nowrap; pointer-events: auto; cursor: pointer; padding: 1px 4px; border-radius: 2px; text-shadow: 0 0 4px #000, 0 0 8px #000; transform: translateY(-14px); user-select: none; }
.label:hover, .label.sel { color: #fff; background: rgba(95,240,255,.15); }
.label.sys { font: 600 13px/1.1 var(--head); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); transform: translateY(-34px); text-align: center; }
.label.sys small { display: block; font: 400 10px/1.3 var(--mono); letter-spacing: 0; text-transform: none; color: var(--dim); }
.label.moon { font-size: 10px; color: var(--dim); transform: translateY(-8px); }
.label.gate { color: #9ff6ff; }
.label.keeper { color: var(--keeper); }
.label.ship { font-size: 10px; color: var(--gold); transform: translateY(-10px); }
.label .v { color: var(--gold); margin-left: 3px; }
.label.anom { color: #b58cff; letter-spacing: .1em; text-transform: uppercase; font-family: var(--head); }
body.nolabels .label { display: none !important; }

#panel { position: fixed; top: 14px; right: 14px; width: 340px; max-height: calc(100% - 190px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; z-index: 6; backdrop-filter: blur(6px); box-shadow: 0 0 30px rgba(0,0,0,.6); }
#panel .kicker { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
#panel h2 { margin: 2px 0 8px; font: 600 20px/1.15 var(--head); letter-spacing: .04em; color: #fff; }
#panel h3 { margin: 14px 0 4px; font: 600 11px/1.2 var(--head); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
#panel p { margin: 6px 0; color: #b9d3ea; }
#panel ul { list-style: none; margin: 0; padding: 0; }
#panel li { padding: 2px 0; }
#panel li button, .linkbtn { background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer; text-align: left; }
#panel li button:hover, .linkbtn:hover { color: var(--accent); }
#panel li .t { color: var(--faint); font-size: 11px; margin-left: 6px; }
#panel li.sub { padding-left: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.chip { font-size: 10px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 10px; color: var(--dim); }
.chip.gold { color: var(--gold); border-color: rgba(255,210,122,.4); }
.chip.warn { color: var(--danger); border-color: rgba(255,90,106,.45); }
.chip.keeper { color: var(--keeper); border-color: rgba(201,139,255,.45); }
.btn { display: inline-block; margin: 8px 6px 0 0; padding: 5px 10px; background: rgba(95,240,255,.08); border: 1px solid var(--line); border-radius: 3px; color: var(--accent); cursor: pointer; font-size: 12px; text-decoration: none; }
.btn:hover { background: rgba(95,240,255,.18); }
.keeperbox { margin-top: 12px; padding: 8px 10px; border: 1px solid rgba(201,139,255,.45); border-left: 3px solid var(--keeper); background: rgba(120,60,180,.12); border-radius: 3px; }
.keeperbox .kh { font: 600 10px/1 var(--head); letter-spacing: .16em; text-transform: uppercase; color: var(--keeper); margin-bottom: 4px; }
.keeperbox p { color: #dcc4f5 !important; }
.muted { color: var(--faint); }
.back { font-size: 11px; margin-bottom: 6px; }
.stat { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
.stat dt { color: var(--dim); }
.stat dd { margin: 0; }
.bar { height: 4px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; background: var(--accent); }

#controls { position: fixed; left: 16px; bottom: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; z-index: 5; max-width: calc(100% - 32px); }
#controls label { display: flex; align-items: center; gap: 5px; color: var(--dim); font-size: 12px; cursor: pointer; }
#controls input[type=range] { width: 90px; accent-color: var(--accent); }
#controls input[type=checkbox] { accent-color: var(--accent); }
#controls select { background: #07121e; border: 1px solid var(--line); border-radius: 3px; padding: 2px 4px; }
#speedv { color: var(--ink); min-width: 34px; }
#lock { background: none; border: 1px solid var(--line); border-radius: 3px; padding: 3px 8px; cursor: pointer; color: var(--dim); }
#lock.on { color: var(--keeper); border-color: var(--keeper); box-shadow: 0 0 10px rgba(201,139,255,.35); }
#keyin { display: none; background: #07121e; border: 1px solid var(--keeper); border-radius: 3px; padding: 3px 6px; width: 110px; color: var(--keeper); }
#keyin.show { display: inline-block; }
#keyin.bad { animation: shake .3s; border-color: var(--danger); }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

#legend { position: fixed; left: 16px; bottom: 62px; font-size: 11px; color: var(--dim); z-index: 5; display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: 560px; pointer-events: none; }
#legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
#help { position: fixed; left: 16px; top: 64px; font-size: 11px; color: var(--faint); z-index: 4; pointer-events: none; max-width: 300px; }

#feed { position: fixed; right: 14px; bottom: 14px; width: 340px; z-index: 5; font-size: 11px; display: flex; flex-direction: column; gap: 3px; }
#feed div { background: var(--panel); border: 1px solid var(--line); border-left: 2px solid var(--dim); padding: 3px 8px; border-radius: 2px; cursor: pointer; animation: slide .35s ease-out; color: #b9d3ea; }
#feed div.kill { border-left-color: var(--danger); }
#feed div.navy { border-left-color: #6f9bff; }
#feed div.keeper { border-left-color: var(--keeper); color: #dcc4f5; }
@keyframes slide { from { opacity: 0; transform: translateX(20px); } }

#panel .art { display: block; width: calc(100% + 32px); max-width: none; margin: -14px -16px 12px; max-height: 190px; object-fit: cover; border-radius: 4px 4px 0 0; border-bottom: 1px solid var(--line); cursor: zoom-in; }
#lightbox { position: fixed; inset: 0; z-index: 12; background: rgba(0,0,0,.88); display: none; place-items: center; align-content: center; gap: 10px; cursor: zoom-out; padding: 16px; }
#lightbox.show { display: grid; }
#lightbox img { max-width: 94vw; max-height: 84vh; border: 1px solid var(--line); border-radius: 4px; }
#lightbox div { font: 600 14px/1 var(--head); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); text-align: center; }
.label.crew { color: var(--gold); font: 600 12px/1 var(--head); letter-spacing: .1em; text-shadow: 0 0 6px #000, 0 0 12px rgba(255,210,122,.5); transform: translateY(-16px); }
#findcrew { background: rgba(255,210,122,.08); border: 1px solid rgba(255,210,122,.45); border-radius: 3px; padding: 3px 8px; cursor: pointer; color: var(--gold); }
#findcrew:hover { background: rgba(255,210,122,.18); }
.crewbox { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: -4px 0 12px; padding: 6px 10px; border: 1px solid rgba(255,210,122,.4); border-radius: 3px; background: rgba(255,210,122,.07); color: var(--gold); font-size: 12px; }
.crewbox .linkbtn { color: var(--gold); }
.crewbox > span:last-child { white-space: nowrap; }
.label.trail { font: 600 10px/1 var(--mono); color: #1a1206; background: rgba(255,210,122,.85); padding: 2px 5px; border-radius: 2px; text-shadow: none; }
.label.trail:hover { background: #ffd27a; color: #000; }
ul.voyage li.vrow { padding: 7px 0; border-top: 1px solid var(--line); }
ul.voyage li.vrow b { color: var(--gold); margin-right: 4px; }
ul.voyage .vstops { font-size: 12px; margin-top: 3px; line-height: 1.7; }
ul.voyage li.now b { color: #fff; }
#hint { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 6; pointer-events: none; font: 600 12px/1 var(--head); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 7px 12px; opacity: 0; transition: opacity .25s; }
#hint.show { opacity: 1; }
#tip { position: fixed; pointer-events: none; z-index: 9; font-size: 11px; background: rgba(0,0,0,.8); border: 1px solid var(--line); padding: 2px 6px; border-radius: 2px; display: none; }
#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .28s; z-index: 8; }
#err { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: var(--danger); z-index: 10; }
body.keeper #panel { border-color: rgba(201,139,255,.35); }

@media (max-width: 760px) {
  #panel { top: auto; bottom: 0; right: 0; left: 0; width: auto; max-height: 45%; border-radius: 6px 6px 0 0; }
  #feed, #help, #legend { display: none; }
  #controls { bottom: auto; top: 58px; left: 16px; gap: 8px; }
}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>

<body>
<div id="app"></div>
<div id="labels"></div>
<header>
  <h1>Nav</h1>
  <div id="crumbs"></div>
</header>
<div id="help">Drag to orbit · right-drag to pan · scroll to zoom<br>Scroll into a star to enter its system · scroll out to leave<br>Click to inspect · Esc to go back</div>
<aside id="panel"></aside>
<div id="legend"></div>
<div id="controls">
  <label title="Simulation speed">Speed <input id="speed" type="range" min="-2" max="3" step="1" value="0"><span id="speedv">1×</span></label>
  <label><input id="traffic" type="checkbox" checked> Traffic</label>
  <label><input id="labelsOn" type="checkbox" checked> Labels</label>
  <label><input id="orbitsOn" type="checkbox" checked> Orbits</label>
  <label><input id="trailOn" type="checkbox" checked> Trail</label>
  <label>Skin <select id="skin">
    <option value="holo">Holo-tactical</option>
    <option value="textured">Textured</option>
    <option value="procedural">Procedural (animated)</option>
  </select></label>
  <button id="findcrew" title="Fly to the crew's ship" hidden>◆ Crew ship</button>
  <button id="lock" title="Keeper layer">🔒 Keeper</button>
  <input id="keyin" type="password" placeholder="keyword" autocomplete="off">
</div>
<div id="feed"></div>
<div id="tip"></div>
<div id="hint"></div>
<div id="lightbox"><img alt=""><div></div></div>
<div id="fade"></div>
<div id="err">The map couldn't load Three.js from the CDN. It needs an internet connection the first time it opens.</div>

<script>window.MAP_DATA = /*__MAP_DATA__*/null;</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const D = window.MAP_DATA;
// Campaign wording, from layout.json's "page" block (see layout.example.json).
const PAGE = {
  title: 'Star Map', nav_title: 'Nav', region: 'Sector', region_kicker: 'Sector', site_name: 'Campaign site',
  navy_label: 'Navy', navy_prefix: '', home_port: null, hauler_names: {}, ...(D.page || {}),
};
document.title = PAGE.title;
const V3 = THREE.Vector3;
const TAU = Math.PI * 2;
const $ = s => document.querySelector(s);
document.querySelector('h1').textContent = PAGE.nav_title;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const ROMAN = { I: 1, II: 2, III: 3, IV: 4, V: 5, VI: 6, VII: 7, VIII: 8, IX: 9, X: 10, XI: 11, XII: 12 };
const num = n => { const m = / ([IVX]+)$/.exec(n); return m ? (ROMAN[m[1]] ?? 99) : 99; };
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return ((h >>> 0) % 100000) / 100000; }

// ─── Data index ────────────────────────────────────────────────────────────
const SYS = new Map(D.systems.map(s => [s.name, s]));
const ENT = new Map();
for (const s of D.systems) {
  ENT.set(s.name, { e: { ...s, kind: 'system', type: 'star system' }, sys: s.name });
  for (const e of s.entities) ENT.set(e.name, { e, sys: s.name });
}
for (const a of D.anomalies) ENT.set(a.name, { e: { ...a, kind: 'anomaly', type: 'gravitational anomaly' }, sys: null });
for (const e of D.unplaced) ENT.set(e.name, { e, sys: null });
const CHILDREN = new Map();
for (const [n, { e }] of ENT) {
  if (e.parent && e.kind !== 'system' && ENT.has(e.parent)) {
    if (!CHILDREN.has(e.parent)) CHILDREN.set(e.parent, []);
    CHILDREN.get(e.parent).push(n);
  }
}
const sysVec = n => new V3(...SYS.get(n).pos);
// The crew's ship, placed from its own note's frontmatter by the builder.
const CREW = D.crew && SYS.has(D.crew.system) ? D.crew : null;
if (CREW) ENT.set(CREW.name, { e: { name: CREW.name, kind: 'crewship', type: CREW.label, overview: CREW.overview, file: CREW.file, sessions: CREW.sessions }, sys: CREW.system });
const routesOf = n => D.routes.filter(r => r.a === n || r.b === n);
const otherEnd = (r, n) => (r.a === n ? r.b : r.a);
const shortName = n => n.replace(/ System$/, '');
let K = null; // decoded Keeper blob once unlocked
function decodeKeeper() {
  const bin = atob(D.keeper);
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
}

// ─── System layouts (shared by renderer and traffic sim) ───────────────────
const LAYOUT = new Map();
function laneAngle(sysName, r) {
  const p = SYS.get(sysName).pos, q = SYS.get(otherEnd(r, sysName))?.pos;
  return q ? Math.atan2(q[2] - p[2], q[0] - p[0]) : null;
}
function computeLayout(sys) {
  const L = { sys: sys.name, desc: new Map(), exits: [], ports: [], edge: 0 };
  const ents = sys.entities;
  const isNum = n => / [IVX]+$/.test(n);
  const stars = ents.filter(e => e.kind === 'star');
  const prim = stars.filter(s => !isNum(s.name));
  const secStars = stars.filter(s => isNum(s.name));
  if (prim.length === 1) L.desc.set(prim[0].name, { type: 'fixed', p: [0, 0, 0], size: 3.2 });
  else prim.forEach((s, i) => L.desc.set(s.name, { type: 'orbit', center: null, r: i ? 4.6 : 2.3, w: 0.3, phase: i * Math.PI, size: i ? 2 : 2.8 }));

  const seq = [...ents.filter(e => e.kind === 'planet'), ...secStars].sort((a, b) => num(a.name) - num(b.name) || a.name.localeCompare(b.name));
  for (const b of ents.filter(e => e.kind === 'belt')) {
    let i = b.between ? seq.findIndex(p => p.name === b.between[0]) + 1 : 0;
    if (i <= 0) i = Math.ceil(seq.length / 2);
    seq.splice(i, 0, b);
  }
  const orbital = ents.filter(e => e.kind === 'station' && !e.anchor && e.parent === sys.name);
  seq.push(...orbital);
  let r = prim.length > 1 ? 12 : 9;
  for (const e of seq) {
    const giant = e.size === 'giant' || e.kind === 'star';
    r += e.kind === 'belt' ? 7 : e.kind === 'station' ? 6 : giant ? 11 : 8;
    if (e.kind === 'belt') { L.desc.set(e.name, { type: 'belt', r, width: 2.4, w: 0.7 / Math.pow(r, 1.5) }); r += 3; continue; }
    const size = e.kind === 'star' ? 1.9 : e.kind === 'station' ? 0.9 : giant ? 2.6 : 1.3;
    L.desc.set(e.name, { type: 'orbit', center: null, r, w: 2.2 / Math.pow(r, 1.5), phase: hash(e.name) * TAU, size });
    if (giant) r += 3;
  }
  L.edge = r + 16;

  const moons = new Map();
  for (const e of ents.filter(e => e.kind === 'moon')) { if (!moons.has(e.parent)) moons.set(e.parent, []); moons.get(e.parent).push(e); }
  for (const [p, ms] of moons) {
    const pd = L.desc.get(p);
    ms.sort((a, b) => a.name.localeCompare(b.name)).forEach((m, i) =>
      L.desc.set(m.name, { type: 'orbit', center: pd ? p : null, r: (pd?.size ?? 1.3) + 1.8 + i * 1.3, w: 0.6 / (1 + i * 0.5), phase: hash(m.name) * TAU, size: 0.45 }));
  }
  const hostBody = n => { let cur = ENT.get(n)?.e.parent, guard = 0; while (cur && guard++ < 12) { if (L.desc.has(cur) && L.desc.get(cur).type !== 'belt') return cur; cur = ENT.get(cur)?.e.parent; } return null; };
  for (const e of ents.filter(e => e.kind === 'station' && !L.desc.has(e.name))) {
    if (e.anchor && L.desc.has(e.anchor)) {
      const ps = L.desc.get(e.anchor).size, nm = moons.get(e.anchor)?.length ?? 0;
      L.desc.set(e.name, { type: 'orbit', center: e.anchor, r: ps + 2.4 + nm * 1.3, w: 0.35, phase: hash(e.name) * TAU, size: 0.8 });
    } else {
      const host = hostBody(e.name);
      if (host) L.desc.set(e.name, { type: 'surface', center: host, lat: (hash(e.name) - 0.5) * 1.6, lon: hash(e.name + 'x') * TAU, size: 0.35 });
    }
  }
  L.pins = [];
  for (const e of ents.filter(e => e.kind === 'site' && e.sessions?.length)) {
    const host = hostBody(e.name);
    if (host && ['planet', 'moon'].includes(ENT.get(host).e.kind)) {
      L.desc.set(e.name, { type: 'surface', center: host, lat: (hash(e.name) - 0.5) * 2, lon: hash(e.name + 'y') * TAU, size: 0.22 });
      L.pins.push(e.name);
    }
  }

  const planets = ents.filter(e => e.kind === 'planet').map(e => e.name).sort((a, b) => b.length - a.length);
  for (const g of ents.filter(e => e.kind === 'gate')) {
    const route = D.routes.find(rt => rt.gates[sys.name] === g.name);
    let ang = route ? laneAngle(sys.name, route) : null;
    if (ang === null) ang = hash(g.name) * TAU;
    const anchor = g.anchor || planets.find(p => g.name.startsWith(p + ' '));
    if (anchor && L.desc.has(anchor)) {
      const ps = L.desc.get(anchor).size, side = / B$/.test(g.name) ? 1 : / A$/.test(g.name) ? -1 : 0, d = ps + 4.5;
      L.desc.set(g.name, { type: 'anchored', center: anchor, off: [Math.cos(ang) * d - Math.sin(ang) * side * 2.6, 0.5, Math.sin(ang) * d + Math.cos(ang) * side * 2.6], size: 1.8, ang });
    } else {
      const R = sys.outer_gates.includes(g.name) ? L.edge + 10 : L.edge;
      L.desc.set(g.name, { type: 'fixed', p: [Math.cos(ang) * R, 0, Math.sin(ang) * R], size: 2, ang });
    }
  }
  for (const rt of routesOf(sys.name)) {
    const gate = rt.gates[sys.name] || null;
    const ang = laneAngle(sys.name, rt) ?? 0;
    L.exits.push({ route: rt, gate, p: gate ? null : [Math.cos(ang) * (L.edge + 6), 0, Math.sin(ang) * (L.edge + 6)] });
  }
  // A Keeper-only concealed gate, placed just past its `near` body on the side facing where it leads.
  const hg = D._hidden?.find(h => h.system === sys.name);
  if (hg) {
    const near = L.desc.get(hg.near), vpos = D.anomalies.find(a => a.name === hg.leads_to)?.pos;
    const p0 = sys.pos, ang = vpos ? Math.atan2(vpos[2] - p0[2], vpos[0] - p0[0]) : 0;
    const R = (near?.r ?? L.edge) + 7;
    L.desc.set(hg.name, { type: 'fixed', p: [Math.cos(ang) * R, 1.5, Math.sin(ang) * R], size: 2, ang, keeper: true });
    L.hidden = hg;
  }

  if (trafficOn) {
    for (let left = sdt; left > 1e-6; left -= 0.1) simStep(Math.min(0.1, left));
    spawnClock += sdt; if (spawnClock > 1.5) { spawnClock = 0; populate(false); }
  } else simT += sdt;
  U_TIME.value = simT;
  if (mode === 'sector') {
    updateDots(); updateCrewMarker();
    for (const sp of sectorSpin) sp.rotation.y += rdt * 0.08;
    for (const u of sectorUpdaters) u();
    for (const [n, br] of battleRings) { const hot = trafficOn && simT - sysStats.get(n).lastBattle < 4; br.material.opacity = hot ? 0.5 + 0.4 * Math.sin(performance.now() / 150) : 0; br.material.rotation += rdt; }
  } else {
    updateSystemView(simT);
    for (const sp of spinners) sp.rotation.z += rdt * 0.4;
    syncShipViews(rdt); updateEffects(rdt * Math.min(speed, 2));
  }
  if (selected && !(selected.type === 'ship' && ships.find(x => x.id === selected.id)?.f === 'crew')) {
    const p = refPos(selected);
    if (p) { selRing.visible = true; selRing.position.copy(p); selRing.scale.setScalar(refSize(selected) * 2.7); selRing.material.opacity = 0.55; selRing.material.rotation += rdt * 0.6; }
    else selRing.visible = false;
  } else selRing.visible = false;
  panelTick += rdt;
  if (panelTick > 0.5) { panelTick = 0; if (panelRef?.type === 'ship') showPanel(panelRef, 'keep'); }
  stepCamera(rdt);
  checkZoomSwitch();
  controls.update();
  composer.render(); labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
<script>setTimeout(() => { if (!window.__booted && !document.querySelector('#app canvas')) document.getElementById('err').style.display = 'grid'; }, 6000);</script>
