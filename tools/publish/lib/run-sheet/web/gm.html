<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run sheet</title>
<link rel="stylesheet" href="/web/gm.css">
<link rel="stylesheet" href="/tohit/tohit.css">
</head>
<body>
<header class="top" id="top">
  <div class="bar">
    <h1 id="ttl">Run sheet</h1><span class="sub" id="sub"></span><span class="round" id="round" hidden></span><span class="sp"></span>
    <span class="hjotw"><input id="hjot" placeholder="Jot (J)" aria-label="Jot a line for the beat in play" autocomplete="off"><span class="noted" id="hnoted" role="status" aria-live="polite"></span></span>
    <span class="saved" id="saved" role="status" aria-live="polite">Saved</span>
    <button class="warnb" id="warnBtn" type="button"></button>
    <button id="coloursBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="coloursMenu" title="The colours of the sides in a fight">Colours</button>
    <button id="playersBtn" type="button" title="Open the players' window: put it on the screen they can see">Players' screen</button>
    <button id="endBtn" type="button">End of night</button>
  </div>
  <div class="cmenu" id="coloursMenu" role="group" aria-label="Side colours" hidden></div>
  <div class="hnotes" id="hnotes"></div>
</header>
<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="The run"></nav>
  <main class="sheet" id="sheet"><p class="muted">The run sheet is starting.</p></main>
  <div class="grip" id="grip" role="separator" aria-orientation="vertical" aria-label="Drag to resize; double-click to reset" title="Drag to resize · double-click to reset"></div>
  <aside class="side" id="side" aria-label="The players' screen"></aside>
</div>
<div class="drawer" id="drawer" role="dialog" aria-label="Note" tabindex="-1"></div>
<dialog class="thdlg" id="tohitDlg" aria-label="To-hit calculator"></dialog>
<script src="/web/coc-math.js"></script>
<script src="/web/fight-math.js"></script>
<script src="/web/record-rank.js"></script>
<script src="/web/gurps-math.js"></script>
<script src="/web/fight.js"></script>
<script src="/web/show.js"></script>
<script src="/web/state.js"></script>
<script src="/players/render.js"></script>
<script src="/web/gm.js"></script>
<script src="/web/gm-fight.js"></script>
<script src="/tohit/gurps-tohit.js"></script>
<script src="/web/gm-tohit.js"></script>
</body>
</html>
