<section class="sheet clip-sheet" aria-label="Sheet {{sheet_number}} of {{sheet_count}}">
  <article class="clipping">
    {{#first}}{{#prop_masthead}}<p class="masthead">{{prop_masthead}}</p>{{/prop_masthead}}
    {{#prop_dateline}}<p class="dateline">{{prop_dateline}}</p>{{/prop_dateline}}{{/first}}
    <div class="column">{{{text}}}</div>
  </article>
</section>
