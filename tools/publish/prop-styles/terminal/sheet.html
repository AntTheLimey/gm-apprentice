<section class="sheet term" aria-label="Sheet {{sheet_number}} of {{sheet_count}}">
  <div class="chrome top"><span class="tiles" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="device">{{#prop_device}}{{prop_device}}{{/prop_device}}{{^prop_device}}TERMINAL OUTPUT{{/prop_device}}</span><b>SHEET {{sheet_number}}/{{sheet_count}}</b></div>
  <div class="screen">{{{text}}}</div>
  <div class="chrome bottom"><span>PRINT SPOOL · 1 COPY</span><span class="amber">{{#last}}END OF FILE ■{{/last}}{{^last}}MORE ▼{{/last}}</span></div>
</section>
