<section class="sheet scroll-sheet{{#first}} first-sheet{{/first}}" aria-label="Sheet {{sheet_number}} of {{sheet_count}}">
  <div class="scroll">
    <div class="rod top" aria-hidden="true"></div>
    <div class="vellum" {{#prop_font}}style="--hand: '{{prop_font|font}}'"{{/prop_font}}>{{{text}}}</div>
    <div class="rod bottom" aria-hidden="true"></div>
  </div>
</section>
