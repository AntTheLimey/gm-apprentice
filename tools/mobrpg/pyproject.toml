[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mobrpg-cli"
# This is the mobrpg-cli package's own version. It is INDEPENDENT of the
# gm-apprentice marketplace plugin version (.claude-plugin/plugin.json); do not
# sync the two. `mobrpg --version` reports this value.
version = "0.1.0"
description = "CLI over the mobRPG world-builder API for gm-apprentice vault sync"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mobrpg = "mobrpg.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mobrpg*"]

# Ship as package data so it is present in the wheel and resolvable at runtime.
# The ontology JSON loads via importlib.resources (map_cmd, lazily). The 7 legacy
# fallback scripts (+ smoketest.py, which 4 of them import) live under _legacy/ so
# cli._shellout can run them under a wheel install; without this they are excluded
# by `include = ["mobrpg*"]` and every fallback verb dies with "can't open file".
[tool.setuptools.package-data]
mobrpg = ["gm-apprentice-ontology.json", "_legacy/*.py"]
